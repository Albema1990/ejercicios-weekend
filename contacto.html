    <main>
      <h2>Contacto</h2>
      <form action="" method="post">
        <label for="nombre">Nombre:</label>
        <div>
          <input type="text" id="nombre" name="nombre" required />
        </div>

        <label for="email">Correo electrónico:</label>
        <div>
          <input type="email" id="email" name="email" required />
        </div>

        <label for="mensaje">Mensaje:</label>
        <div>
          <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
        </div>
        <div>
          <button type="submit">Enviar</button>
        </div>
      </form>

      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d44738.02175307497!2d-122.89731304179685!3d45.50753489999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54950ec24d4da46d%3A0xa6e823d05767d2d0!2sNike%20World%20Headquarters!5e0!3m2!1ses!2ses!4v1770583344396!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

      <address>
        <h3>Oficina central</h3>
        <p>Dirección: Calle de la Princesa, 123, Madrid</p>
        <p>Teléfono: 91 123 45 67</p>
        <p>Correo electrónico: contacto@nike.com</p>
      </address>
